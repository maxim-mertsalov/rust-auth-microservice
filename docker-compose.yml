version: '3.8'

services:
  migrator:
    image: rust:1.92-slim
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/auth_db
    command: >
      sh -c "cargo install sqlx-cli --no-default-features --features postgres && 
             sqlx migrate run"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - PG_URL=postgres://user:password@postgres:5432/auth_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  # 2. Main Storage (PostgreSQL)
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=auth_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # 3. Session Cache (Redis)
  redis:
    image: redis:7-alpine
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: # Ensures your data survives if you stop the containers