[package]
name = "auth_service"
version = "0.1.0"
edition = "2024"
authors = ["Maksym Mertsalov"]
license = "MIT"

[dependencies]
# Server
actix-web = "4.12.0"
tokio = { version = "1.48.0", features = ["full"] }
validator = { version = "0.20.0", features = ["derive"] }

# Config
env_logger = "0.11.8"
dotenv = "0.15.0"

# Utils
bcrypt = "0.18.0"
argon2 = "0.5.3"
rand = "0.9.2"
regex = "1.12.2"
aws-lc-rs = {version =  "1.15.2" }
hex = "0.4.3"
jsonwebtoken = {version =  "10.2.0", features = ["aws_lc_rs"] }

# Common
serde = { version = "1.0.228", features = ["derive"], default-features = false }
postcard = { version = "1.1.3", features = ["alloc"] }
serde_json = { version = "1.0.143", features = ["raw_value"], default-features = false }
log = "0.4.27"
uuid = { version = "1.18.1", features = ["serde", "v4", "v7"] }
chrono = { version = "0.4.42", features = ["serde"] }
async-trait = "0.1.89"

# Postgres
sqlx = { version = "0.8.3", features = ["postgres", "uuid", "chrono", "derive", "json", "runtime-tokio-native-tls"] }

# Redis
redis = { version = "1.0.2", features = ["bb8", "json", "tokio-native-tls-comp"] }
bb8-redis = "0.26.0"
bb8 = "0.9.1"

# Other
lettre = { version =  "0.11.19" , features = ["tokio1-native-tls", "smtp-transport"]}





